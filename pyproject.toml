[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "open-vocabulary-classification"
version = "0.0.1"
authors = [
  { name = "Ryuto Yoshida" },
]
description = "Unified interface for open-vocabulary image classifiers (CLIP, OpenCLIP, MetaCLIP, MetaCLIP 2, SigLIP, SigLIP 2) with selectable image pooling."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "pillow>=10.1",
    "torch",
    "transformers>=5.0,<6",
    "sentencepiece",
    "protobuf",
    "pyyaml",
]

[project.scripts]
open-vocabulary-classify = "open_vocabulary_classification.cli:ClassifyCommand.main"

[project.urls]
Homepage = "https://github.com/ry-yoshida-dev/OpenVocabularyClassification"
"Bug Tracker" = "https://github.com/ry-yoshida-dev/OpenVocabularyClassification/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "types-PyYAML", "mypy", "basedpyright", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
open_vocabulary_classification = ["py.typed", "config/*/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["pretrained: downloads real model weights; run with --run-pretrained"]

[tool.mypy]
strict = true
mypy_path = "src"
untyped_calls_exclude = ["transformers.modeling_utils"]

[[tool.mypy.overrides]]
module = ["conftest", "test_backends", "test_pretrained"]
disallow_untyped_calls = false

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
reportUnknownMemberType = false
reportMissingTypeStubs = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "D", "PT", "C4", "PIE", "RET"]
ignore = ["D100", "D104", "D105", "D107", "D200", "D205"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
