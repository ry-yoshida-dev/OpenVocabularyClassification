classifier:
  backend: siglip
  weights_path: google/siglip-base-patch16-224
  image_pooling: attention
  image_fit: letterbox
  text_templates:
    - "a photo of a {}."
  aggregation:
    - {unit: template, timing: embedding, method: mean}
    - {unit: prompt, timing: similarity, method: max}
  batch_size: 32
  device: auto
  precision: float32
