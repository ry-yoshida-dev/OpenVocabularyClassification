classifier:
  backend: clip
  weights_path: laion/CLIP-ViT-H-14-laion2B-s32B-b79K
  image_pooling: class_token
  image_fit: letterbox
  text_templates:
    - "a photo of a {}."
  aggregation:
    - {unit: template, timing: embedding, method: mean}
    - {unit: prompt, timing: similarity, method: max}
  batch_size: 8
  device: auto
  precision: float32
