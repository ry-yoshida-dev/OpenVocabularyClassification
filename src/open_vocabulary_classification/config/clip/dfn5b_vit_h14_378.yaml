classifier:
  backend: clip
  weights_path: apple/DFN5B-CLIP-ViT-H-14-378
  image_pooling: class_token
  image_fit: letterbox
  text_templates:
    - "a photo of a {}."
  aggregation:
    - {unit: template, timing: embedding, method: mean}
    - {unit: prompt, timing: similarity, method: max}
  batch_size: 4
  device: auto
  precision: float32
