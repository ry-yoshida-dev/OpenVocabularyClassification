classifier:
  backend: clip
  weights_path: facebook/metaclip-h14-fullcc2.5b
  image_pooling: class_token
  image_fit: letterbox
  text_templates:
    - "a photo of a {}."
  aggregation:
    - {unit: template, timing: embedding, method: mean}
    - {unit: prompt, timing: similarity, method: max}
  batch_size: 8
  device: auto
  precision: float32
